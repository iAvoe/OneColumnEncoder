name: Bug and anomalies report / Bug 与异常报告
description: Crashes, UI layout/updating fails, encoding fails, missing checks, etc. 崩溃、界面崩坏/不更新、压制任务失败、缺少检查条件等
assignees:
  - iAvoe
body:
  - type: textarea
    id: brief
    attributes:
      label: Brief 概述
      description: >
        One liner, if this can be explained shortly; write longer if needed. 一句话说明，必要时补充。
    validations:
      required: true

  - type: textarea
    id: environment-os
    attributes:
      label: Environment——OS 操作系统
      description: >
        i.e. Windows 10 Version 22H2 Build 19045. 例：Windows 10 版本 22H2 内部版本 19045。

        - Click `Start Menu`, enter `winver` and press Enter. 点击“开始”菜单，输入 `winver` 并按回车
    validations:
      required: true

  - type: textarea
    id: environment-hardware
    attributes:
      label: Environment——Hardware 硬件
      description: >
        not needed if unrelated to the issue. 与本议题无关均可略过。

        - CPU model, RAM capacity. CPU 型号、内存容量

  - type: textarea
    id: whereabouts-text
    attributes:
      label: Fault location 故障定位
      description: >
        To locate where and what caused this issue. 用于定位问题发生的位置和可能原因。

        - Caused by data——which data, for what purpose. 由数据引起——哪些数据，用于什么目的。

        - Happens somewhere——at Main Page, Filter Editor, Encoder Settings, etc.; be specific down to UI element (button, text-box) if possible. 发生在特定位置——主页、筛选器编辑器、编码器设置等；如可能，请具体到 UI 元素（按钮、文本框）。

        - Reproducible by action——list steps to reproduce. 可复现——列出复现步骤。
    validations:
      required: true

  - type: textarea
    id: whereabouts-image
    attributes:
      label: Whereabouts——Image 定位问题——图片
      description: >
        Provide if an image explains things better, take advantage of it. 若图片描述问题更清晰则用。

        - Upload the image to a Dropbox/Google Drive, ..., set access permission to public, then share the link. 将图片上传至网盘，*把访问权限设为公开*，然后分享链接。

        - Verify view permission with the browser's *incognito mode*. 用浏览器的*隐身模式*检查访问权限。

  - type: textarea
    id: correction
    attributes:
      label: Expectation 预期说明
      description: >
        Behavior related——say the expected behavior. 行为相关——说明预期行为。

        - Data related——say the expected string/integer value. 数据相关——说明预期的字符串/整数值。

  - type: textarea
    id: other-details
    attributes:
      label: Other Details 其他详情
      description: >
        If an error modal is visible, right-click and copy the error string, then paste it here. 如果错误弹窗出现，右键复制错误字符串并粘贴到此处。

        - Modify the file path if the names in is unapproriate. 如果文件或路径名不适当公开则修改。

  - type: textarea
    id: additions
    attributes:
      label: Additions 补充
      description: >
        Add any other context you think would be useful. 添加可能有用的任何其他信息。
