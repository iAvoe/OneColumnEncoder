name: Build and Release x86 x64 7zips

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to create release for (leave empty to auto-generate Commit{count})'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*' # v1.x pattern
      - '*-beta' # v1.0-beta

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine final tag name
        shell: pwsh
        run: |
          $tag = ""
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -like "refs/tags/*") {
            # Push tags 触发：直接使用推送的标签
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $inputTag = "${{ inputs.tag_name }}".Trim()
            if ($inputTag -ne "") {
              $tag = $inputTag
            } else {
              # 自动生成 Commit{提交数}
              $count = git rev-list --count HEAD
              $tag = "Commit$count"
            }
          }
          if ($tag -eq "") {
            Write-Error "Unable to determine tag name."
            exit 1
          }
          echo "FINAL_TAG=$tag" >> $env:GITHUB_ENV
          Write-Host "[SUCCESS] Final tag: $tag"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Publish x86
        run: |
          dotnet publish OneColumnEncoder.csproj `
            --configuration Release `
            --runtime win-x86 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output ./publish/x86

      - name: Publish x64
        run: |
          dotnet publish OneColumnEncoder.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output ./publish/x64

      - name: Copy extra tools
        shell: pwsh
        run: |
          if (Test-Path ".\cicd") {
            Copy-Item -Path ".\cicd\x64-upstreams-encoders.7z" -Destination ".\publish\x64\" -Force
            Copy-Item -Path ".\cicd\x86-upstreams-encoders.7z" -Destination ".\publish\x86\" -Force
            # 完整拷贝 x64-CloudinarySSIMULACRA2.1 文件夹及其子文件
            Copy-Item -Path ".\cicd\x64-CloudinarySSIMULACRA2.1" -Destination ".\publish\x64\" -Recurse -Force
            Copy-Item -Path ".\cicd\x64-GoogleButteraugli" -Destination ".\publish\x64\" -Recurse -Force
            Copy-Item -Path ".\cicd\x64-AVS-VS-plugins" -Destination ".\publish\x64\" -Recurse -Force
            Write-Host "✅ Tools copied to both publish folders."
          } else {
            throw "[MISSING] No 'cicd' folder found, cannot continue."
          }

      - name: Pack x86
        run: 7z a -t7z -mx9 1cenc-win-x86.7z .\publish\x86\*

      - name: Pack x64
        run: 7z a -t7z -mx9 1cenc-win-x64.7z .\publish\x64\*

      - name: Prepare Release Info (commit number, SHA, notes)
        shell: pwsh
        run: |
          $count = git rev-list --count HEAD
          $sha = git rev-parse --short=8 HEAD
          $title = "Commit $count $sha"

          $body = "Commit# | 提交序号 / SHA`n"
          $body += "- https://github.com/iAvoe/OneColumnEncoder/commit/$($env:GITHUB_SHA)`n`n"
          
          $body += "Follow this tutorial to get tools (pipe upstream / filtering tools & video encoders) tailored for your use case | 你可以根据此教程来获取合适的工具（管道上游程序/滤镜工具与视频编码器）:`n"
          $body += "- [Encoding Tools Download Tutorial](https://github.com/iAvoe/encoding-tools-download-tutorial)`n`n"
          $body += "Or, TLDR; and use tools provided in downloaded package (not recommended but it works) | 或者着急要用的话，也可以无视上述教程，下载并直接使用附带的工具（不推荐但可以）"

          $body += "`n`n"
          $body += "> [!WARNING]`n"
          $body += "> The Video Source Repart mode is unfinished and does not work, this release is meant for handling changes and bug fixes | 视频源重分集功能尚未完成，且无法使用，此发布是为了调整行为和修复异常"
          $body += "`n`n"
          $body += "> [!NOTE]`n"
          $body += "> The post-IVTC total frame count & FPS revising mechanic lacks of testing, despite unimportant, referencing is not advsied | IVTC 后的总帧数与帧率计算机制缺乏测试；该功能暂无大用，但也不建议作为参考"
          $body += "`n`n"
          $body += "> [!NOTE]`n"
          $body += "> x86 release (32bit) has limited integration since many of tools and libraries lacks this support (fixing attempts were unsuccessful), this verion is expected to be harder to use and requires higher software IT skills | x86 发布版本缺少多种工具集成，因为 32bit 编译缺少支持且修正不了，或许仍有修复机会"

          echo "RELEASE_TITLE=$title" >> $env:GITHUB_ENV
          $body | Out-File -FilePath .\release-notes.md -Encoding utf8

      - name: Delete existing release (if any)
        shell: pwsh
        run: |
          gh release delete "${{ env.FINAL_TAG }}" -y || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release and Upload Assets
        shell: pwsh
        run: |
          gh release create "${{ env.FINAL_TAG }}" `
            --title "${{ env.RELEASE_TITLE }}" `
            --notes-file .\release-notes.md `
            1cenc-win-x86.7z 1cenc-win-x64.7z
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
