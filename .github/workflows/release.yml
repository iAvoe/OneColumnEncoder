name: Build and Release x86 x64 7zips

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Semantic version tag to create release for (vX.Y.Z)'
        required: true
        type: string
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine final tag name
        shell: pwsh
        run: |
          $tag = ""
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -like "refs/tags/*") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $inputTag = "${{ inputs.tag_name }}".Trim()
            $tag = $inputTag
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "Release tag must use vX.Y.Z format, received: '$tag'."
            exit 1
          }
          echo "FINAL_TAG=$tag" >> $env:GITHUB_ENV
          echo "RELEASE_VERSION=$($tag.Substring(1))" >> $env:GITHUB_ENV
          Write-Host "[SUCCESS] Final tag: $tag"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Validate project version
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\OneColumnEncoder.csproj
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($projectVersion -ne "${{ env.RELEASE_VERSION }}") {
            Write-Error "Project version '$projectVersion' does not match release tag '${{ env.FINAL_TAG }}'."
            exit 1
          }

      - name: Publish x86
        run: |
          dotnet publish OneColumnEncoder.csproj `
            --configuration Release `
            --runtime win-x86 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output ./publish/x86

      - name: Publish x64
        run: |
          dotnet publish OneColumnEncoder.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output ./publish/x64

      - name: Copy extra tools
        shell: pwsh
        run: |
          if (Test-Path ".\cicd") {
            # 编码器
            Copy-Item -Path ".\cicd\x64-upstreams-encoders.7z" -Destination ".\publish\x64\" -Force
            Copy-Item -Path ".\cicd\x86-upstreams-encoders.7z" -Destination ".\publish\x86\" -Force
            # 单图画质跑分算法 + 附带的滤镜：默认放进 1cenc 配置目录
            Copy-Item -Path ".\cicd\1cenc" -Destination ".\publish\x64\" -Recurse -Force
            Write-Host "✅ Tools copied to both publish folders."
          } else {
            throw "[MISSING] No 'cicd' folder found, cannot continue."
          }

      - name: Prepare Release Info (commit number, SHA, notes)
        shell: pwsh
        run: |
          $count = git rev-list --count HEAD
          $sha = git rev-parse --short=8 HEAD
          $title = "1cenc v${{ env.RELEASE_VERSION }}"

          $body = "1cenc v${{ env.RELEASE_VERSION }}`n`n"
          $body += "Build commit: Commit$count $sha | 构建提交：Commit$count $sha`n"
          $body += "- https://github.com/iAvoe/OneColumnEncoder/commit/$($env:GITHUB_SHA)`n`n"
          
          $body += "Follow this tutorial to get tools (pipe upstream / filtering tools & video encoders) tailored for your use case | 你可以根据此教程来获取合适的工具（管道上游程序/滤镜工具与视频编码器）:`n"
          $body += "- [Encoding Tools Download Tutorial | 编码工具下载教程](https://github.com/iAvoe/encoding-tools-download-tutorial)`n`n"
          $body += "Or, TLDR; and use tools provided in downloaded package (not recommended but it works) | 或者着急要用的话，也可以无视上述教程，下载并直接使用附带的工具（不推荐但可以）"
          $body += "`n`n"

          $body += '> [!TIP]'
          $body += "`n"
          $body += '> Auto-import of encoding tools checks 4 locations | 自动导入编码程序会检查 4 种位置：'
          $body += "`n"
          $body += ">`n"
          $body += ">     .`n"
          $body += ">     ├── ①`n"
          $body += ">     ├── OneColumnEncoder.exe`n"
          $body += ">     ├── OneColumnEncoder.pdb`n"
          $body += ">     ├── x64-upstreams-encoders`n"
          $body += ">     │    └── ②`n"
          $body += ">     └── 1cenc`n"
          $body += ">          ├── ③`n"
          $body += ">          ├── x64-upstreams-encoders`n"
          $body += ">          │   └── ④`n"
          $body += ">          ├── x64-AVS-VS-plugins`n"
          $body += ">          │   └── ...`n"
          $body += ">          ├── x64-CloudinarySSIMULACRA2.1`n"
          $body += ">          │   └── ...`n"
          $body += ">          └── x64-GoogleButteraugli`n"
          $body += ">             └── ...`n"
          $body += ">`n"
          $body += "`n"
          $body += "> [!NOTE]`n"
          $body += "> x86 release (32bit) has limited integration since many of tools and libraries lacks this support, provided as-is | x86 发布版本缺少多种工具集成，大多因为 32bit 编译缺少支持，或者依赖的静态库不支持 32bit 且修正不了，请将就使用"
          $body += "`n`n"
          $body += "> [!CAUTION]`n"
          $body += "> File structure changed after Commit 1010 release (using 64bit as example) | 自 Commit 1010 发布的文件结构变化（以 64bit 版本为例）:`n"
          $body += ">`n"
          $body += "> Old | 旧:`n"
          $body += ">`n"
          $body += ">     .`n"
          $body += ">     ├── ... upstreams & encoder exes ...`n"
          $body += ">     ├── OneColumnEncoder.exe`n"
          $body += ">     ├── OneColumnEncoder.pdb`n"
          $body += ">     ├── 1cenc`n"
          $body += ">     │   └── ...`n"
          $body += ">     ├── x64-AVS-VS-plugins`n"
          $body += ">     │   └── ...`n"
          $body += ">     ├── x64-CloudinarySSIMULACRA2.1`n"
          $body += ">     │   └── ...`n"
          $body += ">     └── x64-GoogleButteraugli`n"
          $body += ">         └── ...`n"
          $body += ">`n"
          $body += "> New (cleaner root dir) | 新（根目录更干净）:`n"
          $body += ">`n"
          $body += ">     .`n"
          $body += ">     ├── ... upstreams & encoder exes ... (or inside 1cenc folder)`n"
          $body += ">     ├── OneColumnEncoder.exe`n"
          $body += ">     ├── OneColumnEncoder.pdb`n"
          $body += ">     └── 1cenc`n"
          $body += ">          ├── ...`n"
          $body += ">          ├── x64-AVS-VS-plugins`n"
          $body += ">          │   └── ...`n"
          $body += ">          ├── x64-CloudinarySSIMULACRA2.1`n"
          $body += ">          │   └── ...`n"
          $body += ">          └── x64-GoogleButteraugli`n"
          $body += ">              └── ...`n"
          $body += ">`n"
          $body += "> The new file structure is cleaner, but not backward compatible | 新的文件结构更干净，但不会向后兼容"

          echo "RELEASE_TITLE=$title" >> $env:GITHUB_ENV
          $body | Out-File -FilePath .\release-notes.md -Encoding utf8

      - name: Pack x86
        run: 7z a -t7z -mx9 1cenc-v${{ env.RELEASE_VERSION }}-win-x86.7z .\publish\x86\*

      - name: Pack x64
        run: 7z a -t7z -mx9 1cenc-v${{ env.RELEASE_VERSION }}-win-x64.7z .\publish\x64\*
      
      - name: Delete existing release (if any)
        shell: pwsh
        run: |
          gh release delete "${{ env.FINAL_TAG }}" -y || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release and Upload Assets
        shell: pwsh
        run: |
          gh release create "${{ env.FINAL_TAG }}" `
            --title "${{ env.RELEASE_TITLE }}" `
            --notes-file .\release-notes.md `
            1cenc-v${{ env.RELEASE_VERSION }}-win-x86.7z 1cenc-v${{ env.RELEASE_VERSION }}-win-x64.7z
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
